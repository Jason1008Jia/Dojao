name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      # 如果你的项目里有测试跑不过（比如需要连 MySQL/Hive），先加上 -DskipTests
      # 如果单测是纯本地的，可以把 -DskipTests 去掉
      run: mvn -B package -DskipTests --file pom.xml
