name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      # CI 只做打包：跳过测试执行与测试编译（-DskipTests 只跳过执行，仍会 testCompile）
      # 若以后需要跑纯本地单测，再改成 -DskipTests 或去掉该参数
      run: mvn -B package -Dmaven.test.skip=true --file pom.xml
