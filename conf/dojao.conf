# ============================================================================
# Dojao 配置（conf/dojao.conf）—— 一个文件描述整个集群
#
# 加载优先级：-D 系统属性 > 本文件 > 内置默认。
# 定位顺序：-Ddoja.conf=<路径> > <工作目录>/conf/dojao.conf > classpath:/dojao.conf。
# 文件在 JVM 启动时读一次 ⇒ 改完必须重启进程。
#
# 命名标准：
#   system.*  系统级，第二段是作用域 / 模块（master / worker / ui / connector /
#             metastore / function / python / devcluster …），逐级向下展开
#   query.*   查询相关（不加 system. 前缀）
#   ai.*      预留给后续 AI 相关配置
#
# 角色前缀（异构集群共用一份配置）：<role>.<key>，<role> ∈ master / worker / both，
# 按"进程生效角色"取值，优先级 -D<key> > 文件 <role>.<key> > 文件 <key> > 内置默认。例：
#   master.system.master.host = 0.0.0.0      # A 机（Master）绑全网卡
#   worker.system.master.host = 10.0.0.11    # B / C 机（Worker）连 A 机
#
# 大小值支持带单位写法：512 / 512M / 512MB / 3G / 3GB / 64K / 64KB。
# ============================================================================

# ============================ 节点角色 / 地址 / 端口 ============================

# 本节点角色：master（只起 Master）/ worker（只起 Worker）/ both（同机起 Master + Worker 两个 JVM）。
# 启动脚本 bin/dojao 读取本键决定拉起哪些进程；未设置默认 both。
#   master / worker → 直接 exec DojaoMaster / DojaoWorker（无常驻的 ClusterMain 启动器）；
#   both            → 由 ClusterMain 拉起并看护两个子 JVM。
# 取值非法（如写错成 mater）直接启动失败 —— 角色错了会起错进程，不做静默兜底。
system.role = both

# Master Flight 交互端口（Worker 注册 / 客户端提交 SQL 的入口）。
system.master.port = 6530

# Master Flight 绑定地址（仅 Master 进程用；0.0.0.0 = 全网卡，分机部署时 Worker 才连得进）。
system.master.host = 0.0.0.0

# Worker Flight 端口（全机唯一 Worker 的默认；同机多 Worker 由启动器逐个覆盖）。
system.worker.port = 4009

# Worker Flight 绑定地址。
system.worker.host = 127.0.0.1

# Web 控制台端口（MasterServer 挂 WebUiModule，监控看板 + SQL 控制台）。
system.ui.port = 2380

# 角色前缀示例（both / 分机部署时按需启用）：
#   同机 both：Master 绑 0.0.0.0，Worker 连回环
#   worker.system.master.host = 127.0.0.1
#   三机部署（A=Master，B/C=Worker）：B / C 机的 conf 写 A 机 IP
#   worker.system.master.host = 10.0.0.11

# ============================ 元数据（Master / Worker 须同一文件） ============================

# catalog 注册信息 + 持久化函数的 SQLite 文件（相对进程工作目录）。
system.metastore.sqlite.path = data/dojao-metastore.db

# ============================ 连接器（Master / Worker 同源） ============================

system.connector.catalog = mysql
system.connector.url = jdbc:mysql://localhost:3306/dga
system.connector.user = root
system.connector.password = 123456

# ============================ 内存模型（精简 + 派生） ============================

# 只声明「节点内存总量」，堆 / 堆外 / slot / direct.limit 全按派生链自动算出（见 dojao-dist 的 conf 注释）：
#   system.<role>.memory × heapRatio        → 堆（-Xmx）
#   system.<role>.memory × (1 − heapRatio)  → 堆外（-XX:MaxDirectMemorySize = 共享分配器硬上限）
#   Arrow 预算 = 堆外 − min(堆外 × 20%, 1g)  → 算子共享分配器上限（预留 Netty/gRPC/Flight）
#   perQueryDirect = min(query.memory.max × (1 − heapRatio), Arrow 预算)   # 不配 = Arrow 预算
#   fragmentDirect = perQueryDirect / 并发片段数（默认 2 × system.worker.parallelism）
#   query.slot.memory = fragmentDirect / (3 × spill.ratio)     # 3 = 三槽流水线
# ★该值在 Master 进程计算（启动时）并随片段下发 ⇒ 被 Master 的 system.master.memory 封顶；
#   随包默认 master 2g → slot 落在 32M 下限（即使 worker 配 5g）。要放大就调大 master.memory
#   或直接显式写 query.slot.memory。
# ★Arrow 向量全部走堆外，堆与堆外都必须封顶 —— 否则小内存机器上会被内核 OOM-killer 杀进程
#   （日志无 Java 异常，表现为「一跑开窗/聚合 worker 就莫名挂了」）。本机 4C8G，按小内存预设：
#   Master 2g（堆 1g + 堆外 1g）、Worker 5g（堆 2.5g + 堆外 2.5g）。
# ★下列显式键优先级高于派生，仅需精调时才写：
#   system.master.heap / system.master.direct / system.worker.heap / system.worker.direct
#   query.slot.memory / query.direct.limit
system.master.memory = 2g
system.worker.memory = 5g
# query.memory.heapRatio = 0.5

# ============================ 系统级：并行度 / 内存 ============================

# Master 查询并行分区数（扫描 / hash 分区 / 分布式聚合共用，也即每 query 默认并行度）。
# ★调小 ⇒ 分区数少 ⇒ 单槽阈值(=slot × spillRatio ÷ 分区数)更大 ⇒ 聚合溢写频次更低。
system.master.parallelism = 4

# 单个 Worker 任务池容量（并发任务上限；测试环境 4-10 即可）。
# ★调小 ⇒ 并发片段少 ⇒ fragmentDirect 更大 ⇒ 单 slot 更大 ⇒ 溢写频次更低。
system.worker.parallelism = 6

# Master 侧回退单机聚合的内存预算（分布式多 join / 无法下推的聚合回退到 Master 进程内跑）。
# Master 堆小，此处刻意远小于派生 slot.memory，让聚合提前溢写而不是把 Master 撑爆。
system.master.agg.memory = 256M

# ============================ 查询级：每 query 资源配额 ============================

# 单查询在每台 Worker 上的内存上限（堆 + 堆外；不配 = 本节点 Arrow 预算）。参与 fragmentDirect/slot 派生。
# query.memory.max = 1g
# 单 Worker 并发片段上限（默认 = 2 × system.worker.parallelism）。
# query.memory.maxFragments = 16

# 每 query 算子内存预算（query.slot.memory）默认由派生链算出。需要精调时才显式写（覆盖派生）。
# query.slot.memory = 512M

# 溢写触发比例：算子内存 >= slot.memory x ratio 时溢写到磁盘（(0,1]）。同时参与 slot.memory 的派生。
query.spill.ratio = 0.8

# 单个溢写算子的 Arrow 堆外硬上限（query.direct.limit）默认派生，无需手写。需要精调时才显式配。
# query.direct.limit = 2G

# ============================ 背压水位（共享分配器软节流） ============================

# 堆外用量越过高水位 → 读取端（扫描读页 / 溢写算子累积页）短暂等待，回落低水位或超时放行：
# 内存不够就"读得慢一点"，让溢写追上来而非 OOM。只看堆外<用量>、只做<有界>等待，避免死锁。
# query.memory.highWatermark = 0.85
# query.memory.lowWatermark = 0.75
# query.memory.throttleMaxMs = 1000

# 溢写目录：默认 <DOJAO_HOME>/spill（安装根目录，由 bin/dojao 的启动目录决定）。
# 可配多个目录，逗号分隔 —— 每个溢写算子实例按轮转落到下一个目录，把溢写 I/O 摊到多块盘。
# 相对路径按 DOJAO_HOME 解析；建议写绝对路径。
# ★别指向 /tmp：很多 Linux 上 /tmp 是 tmpfs（内存盘），「溢写到磁盘」会变成吃内存，反而把节点 OOM。
# query.spill.dir = /data1/dojao-spill,/data2/dojao-spill

# 溢写盘使用率上限（(0,1]）：每次真正写溢写文件前都查一次目标目录所在盘，用满该比例就不再往这块盘写 ——
# 换到 query.spill.dir 里下一块合格的盘；所有候选盘都超上限则本次溢写失败，查询报错并列出全部候选
# 目录及各自使用率（不会静默把节点磁盘写爆）。盘容量判定不了时视为可用（fail-open）。
query.spill.disk.maxUsage = 0.8

# 聚合算子 Phase 2 每批聚合的 key 数（collect-evaluate 每批交付给 Python 的 key 数；调大 → 减少往返）。
query.agg.perBatchKeys = 50000

# 聚合算子溢写归并每批 key 数（Phase 2 从溢写文件归并时每批多少个 key）。
query.agg.spill.perBatchKeys = 10000

# 窗口算子输出页行数（内存路径：排序结果每页多少行；溢写路径不再用它定页大小，见下）。
query.window.perBatchKeys = 50000

# 【溢写】窗口算子溢写每批行数 —— 一个"溢写批"最多多少行。决定三件事：① Phase 1 落盘的文件切分粒度
# （文件大小 ≈ 本值 × 单行宽，默认 10000 行 ≈ 1.3MB）② Phase 1.5 归并产物里 record batch 的行数
# ③ 归并输出向量的分配粒度。调大 → 文件更少、归并轮数更少；代价是 gather 时瞬时峰值与归并每路驻留内存变大。
# ★这是「写」侧的旋钮，与「拉取」侧的 query.window.spill.fetchPerKeys 是两件事，别混。
query.window.spill.perBatchRows = 50000

# 【拉取】窗口算子 Phase 2 每次成页回传下游的 key 组数 —— Phase 2 不再「一组一页」，而是跨组累积到
# 本值个 key（或 query.window.perBatchKeys 行）再吐一页。调大 → 下游（如 Hive 写入）每页拿到更多行、
# 每页固定开销被摊薄、吞吐更高；代价是单页内存与端到端延迟一起变大。
# ★这是「读」侧的旋钮，与「写」侧的 query.window.spill.perBatchRows 是两件事，别混。
query.window.spill.fetchPerKeys = 10000

# 顶层无 LIMIT 的 ORDER BY 全局排序超内存预算策略：error（默认，拒绝并提示加 LIMIT）/ warn / spill。
query.sort.topSpillPolicy = error

# ============================ 查询初始并行度决策（动态资源分配） ============================

# 无法从元数据探查到表数据量 / 体积时的兜底并行度。
query.default.parallelism = 4

# 准入阈值：可用并行度 < 应需并行度 x ratio 时阻塞等待释放资源（(0,1]）。
query.admission.ratio = 0.8

# 每 scan 分区承载的数据量（字节）：单表并行度 = min(ceil(byteSize / bytesPerSlot), 可用容量)。
query.parallelism.bytesPerSlot = 1G

# byteSize 未知时的兜底：每 scan 分区行数（bytes 无法探查时按行数估）。
query.parallelism.rowsPerSlot = 1000000

# 每 query 并行度硬上限：设置了就用用户的值（如 20）；-1 = auto，用默认公式 = 集群容量 / worker 数。
# 值越小 → 单 query 上限越低、集群并发 query 越多（吞吐越高）；值越大 → 单 query 用得越多、并发越少。
query.max.parallelism = -1

# 注：query.parallelism 目前是死键（已被上面的动态并行度取代），故不在此列出。
